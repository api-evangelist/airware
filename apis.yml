name: Airware
description: >-
  Airware was an enterprise commercial-drone (UAV) software and aerial-data-analytics
  company founded in 2011 by Jonathan Downey and headquartered in San Francisco. It
  began by building an operating system and autopilot for commercial drones, then
  pivoted to a cloud-based "Aerial Information Platform" that captured, processed, and
  analyzed drone imagery for enterprise verticals such as mining, quarrying, insurance,
  and construction. Airware acquired French drone-analytics firm Redbird in 2016 and
  raised roughly $118M from investors including Andreessen Horowitz (a16z), Kleiner
  Perkins, GV (Google Ventures), Intel Capital, and Next World Capital. The company
  ceased operations in September 2018. It was surfaced as an a16z portfolio company
  and added to the API Evangelist network as a lead; no live developer surface, API,
  or public specification is currently discoverable (the airware.com domain no longer
  resolves), so this profile is retained as a historical/defunct record.
